name: Blog auto

on:
  schedule:
    # Tous les lundis à 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans écrire ni publier"
        type: boolean
        default: false
      topic:
        description: "Forcer un numéro de sujet (vide = prochain non traité)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openai

      - name: Generate article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi

          python scripts/generate-article.py $ARGS
          CODE=$?
          set -e

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          case "$CODE" in
            0)  echo "Article généré." ;;
            78) echo "::notice::Aucun nouveau sujet à traiter — rien à publier." ;;
            *)  echo "::error::Génération échouée (code $CODE)."; exit "$CODE" ;;
          esac

      - name: Commit & push
        if: steps.generate.outputs.exit_code == '0' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Aucune modification à committer."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog/ sitemap.xml rss.xml llms.txt
          git commit -m "chore(blog): article auto du $(date -u +%Y-%m-%d)"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Blog auto"
            echo ""
            echo "- Code de sortie : \`${{ steps.generate.outputs.exit_code }}\`"
            echo "- 0 = article publié · 78 = aucun sujet restant · autre = erreur"
          } >> "$GITHUB_STEP_SUMMARY"
